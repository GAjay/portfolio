name: Sync Instagram feed

on:
  schedule:
    # 05:30 UTC daily (~11:00 IST)
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-instagram
  cancel-in-progress: true

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Crawl Instagram profile
        run: npm run sync:instagram

      - name: Publish public feed JSON
        run: node scripts/apply-instagram-feed.mjs

      - name: Commit and push feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/data/instagram-feed.json \
            src/features/content/data/instagram.generated.json \
            src/features/content/data/instagram.sync-meta.json \
            src/features/content/data/content.generated.json
          if git diff --staged --quiet; then
            echo "No Instagram feed changes to commit."
            exit 0
          fi
          git commit -m "chore(data): sync Instagram feed"
          git push
